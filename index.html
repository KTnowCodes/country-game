<!doctype html>
<html>
  <style>
    .starting {
      color: #ffffff;
      text-align: center;
    }

    body {
      background-color: #000000;
    }

    button:hover{
      background-color: #000000
      color: #ffffff
      transform: scale(1.25);
    }
  </style>
  <script>
    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    
    async function start() {
      alert("The journey awaits...");
      await sleep(2000);
      alert("3");
      await sleep(2000);
      alert("2");
      await sleep(2000);
      alert("1");
    }
      
  </script>
  <head>
    <h1 class="starting"> Country Game </h1>
    <p class="starting"> Make your country victorious </p>
  </head>
  <body>
    <button onclick="start()" style="text-color: #ffffff; background-color: #000000; border-style: solid; border-width: 2px; border-color: #ffffff; justify-content: center;">Begin</button>
  </body>
</html>
