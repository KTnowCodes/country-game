<!doctype html>
<html>
  <style>
    .starting {
      color: #ffffff;
      text-align: center;
    }

    body {
      background-color: #000000;
    }
  </style>
  <script>
    function start() {
      alert("The journey awaits...");
      await sleep(2000);
      alert("3");
      await sleep(2000);
      alert("2");
      await sleep(2000);
      alert("1");
    }
      
  </script>
  <head>
    <h1 class="starting"> Country Game </h1>
    <p class="starting"> Make your country victorious </p>
  </head>
  <body>
    <button onclick="start()" style="text-color: #ffffff; background-color: #000000; border-style: solid; border-width: 2px; border-color: #ffffff; justify-content: center;">Begin</button>
  </body>
</html>
